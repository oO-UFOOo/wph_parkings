version: "3.8"

services:
  db:
    image: postgres:16
    container_name: sopa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: parkingdb
      POSTGRES_USER: parkinguser
      POSTGRES_PASSWORD: parkingpass
      POSTGRES_INITDB_ARGS: "-c max_connections=200"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parkinguser -d parkingdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sopa-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sopa-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/parkingdb?connectTimeout=30&socketTimeout=30
      SPRING_DATASOURCE_USERNAME: parkinguser
      SPRING_DATASOURCE_PASSWORD: parkingpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_HIBERNATE_JDBC_BATCH_SIZE: 20
      SPRING_JPA_HIBERNATE_ORDER_INSERTS: true
      SPRING_JPA_HIBERNATE_ORDER_UPDATES: true
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    networks:
      - sopa-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/users"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  sopa-network:
    driver: bridge
