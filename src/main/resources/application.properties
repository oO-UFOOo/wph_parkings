spring.application.name=parking-app
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/parkingdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:parkinguser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:parkingpass}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.async.request-timeout=30000

# Cache busting for static files
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

