# SOPA Backend - Docker Profile Configuration
# This configuration is activated when spring.profiles.active=docker

spring.application.name=parking-app

# PostgreSQL Connection Settings (Docker-specific)
spring.datasource.url=jdbc:postgresql://db:5432/parkingdb?connectTimeout=30&socketTimeout=30&tcpKeepAlives=true&ApplicationName=sopa-backend
spring.datasource.username=parkinguser
spring.datasource.password=parkingpass
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=15000

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.connection.isolation=2
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# PostgreSQL Specific Hibernate Settings
spring.jpa.properties.hibernate.dialect.storage_engine=innodb
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logging (Docker environment - reduced verbosity)
logging.level.root=WARN
logging.level.com.sopa=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Server Configuration
server.port=8080
server.shutdown=graceful
server.shutdown-wait-time=30s
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=30000

# Application Timeout Settings
spring.mvc.async.request-timeout=30000

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false

# Actuator (for monitoring)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
